name: 通知と議事録
 
on:
  schedule:
    # 5分ごと（終日）。実際にはGitHub側で間引かれるため、cron-job.org から10分ごとに workflow_dispatch で起動する。
    # 議事録のまとめ・日程調整の通知・Stripeの取り込みもこの中で行う
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "管理者の端末にだけテスト通知を送る（テストのときだけチェック）"
        type: boolean
        default: false
      force:
        description: "時刻に関係なく、今日の担当者全員に今すぐ送る"
        type: boolean
        default: false
      dry_run:
        description: "実際には送らず、送る内容だけ表示する"
        type: boolean
        default: false
 
# 外部（cron-job.org）からの実行と定期実行が重なっても、1つずつ順番に動かす（二重送信を防ぐ）
concurrency:
  group: notify
  cancel-in-progress: false
 
# 鍵ファイルを使わずに Google Cloud へつなぐため、GitHub の身分証（OIDCトークン）の発行を許可する
permissions:
  contents: read
  id-token: write
 
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # このリポジトリから動いたときだけ、Firebase の管理用アカウントの権限を、その場限りで借りる
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/973208913635/locations/global/workloadIdentityPools/github/providers/shin-board-repo
          service_account: firebase-adminsdk-fbsvc@shin-board.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund firebase-admin@13
      - run: node send.mjs
        env:
          FIREBASE_PROJECT_ID: shin-board
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          ADMIN_EMAIL: akira.sato@shincareer.com
          SITE_URL: https://penchin1122.github.io/shin-board/
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
 
